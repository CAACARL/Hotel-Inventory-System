    <rect x="-7" y="-50" width="14" height="100" rx="1"/>
    
    <!-- Bottom Left Square -->
    <rect x="-80" y="20" width="40" height="40" rx="3"/>
    <rect x="-70" y="30" width="20" height="20" rx="1"/>
    
    <!-- Bottom Right Square -->
    <rect x="40" y="20" width="40" height="40" rx="3"/>
    <rect x="50" y="30" width="20" height="20" rx="1"/>
